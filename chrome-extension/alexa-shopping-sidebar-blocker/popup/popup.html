<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Alexa for Shopping Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="24" height="24" />
      <h1>Alexa for Shopping Blocker</h1>
    </header>

    <label class="toggle-row" for="enabled-toggle">
      <span>Block the sidebar on Amazon</span>
      <input type="checkbox" id="enabled-toggle" />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <p id="status" class="status"></p>

    <p class="hint">
      Toggling this reloads any open Amazon tabs so the change takes effect
      immediately.
    </p>

    <footer>
      <span id="not-amazon" class="hint hidden"
        >Open an Amazon tab to see live stats.</span
      >
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
